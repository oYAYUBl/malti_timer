<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="タイマー">
<title>マルチタイマー</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1d2a2f;--sub:#6b777c;--line:#dcd8cf;--acc:#0f766e;--accInk:#fff;--warn:#c2410c;--done:#fde9d9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a1d;--card:#1b282c;--ink:#e8eeee;--sub:#8fa0a5;--line:#2c3b40;--acc:#2dd4bf;--accInk:#06201c;--warn:#fb923c;--done:#3a2417;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111a1d;--card:#1b282c;--ink:#e8eeee;--sub:#8fa0a5;--line:#2c3b40;--acc:#2dd4bf;--accInk:#06201c;--warn:#fb923c;--done:#3a2417;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif}
body{padding:16px 16px 96px;max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0 14px}
h2{font-size:14px;color:var(--sub);margin:20px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card.done{background:var(--done);border-color:var(--warn);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.card.done{animation:none}}
input{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;font-size:16px}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.name{font-weight:600;border:none;border-bottom:1px dashed var(--line);border-radius:0;padding:4px 0;margin-bottom:6px}
.time{font-size:48px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:2px 0 10px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--acc);width:100%}
.row{display:flex;gap:8px}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
button.p{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:600}
button.d{color:var(--warn)}
.grow{flex:1}
.hms{display:flex;gap:8px;align-items:center;margin:8px 0}
.hms input{text-align:center}
.hms span{color:var(--sub);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:20px;padding:8px 14px;min-height:40px}
.chip small{color:var(--sub);margin-left:6px}
.empty{color:var(--sub);font-size:14px;padding:6px 2px}
.pre{display:flex;align-items:center;gap:8px}
.pre b{display:block}.pre small{color:var(--sub)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:none;border-radius:0;min-height:56px;color:var(--sub)}
nav button.on{color:var(--acc);font-weight:700}
.hide{display:none}
</style>
</head>
<body>
<h1>マルチタイマー</h1>

<section id="tabT">
  <h2>プリセットから開始</h2>
  <div id="chips" class="chips"></div>
  <h2>動いているタイマー</h2>
  <div id="list"></div>
  <div class="card">
    <input id="nName" placeholder="名前(例:パスタ)" maxlength="30">
    <div class="hms">
      <input id="nH" type="number" inputmode="numeric" min="0" placeholder="0"><span>時間</span>
      <input id="nM" type="number" inputmode="numeric" min="0" placeholder="0"><span>分</span>
      <input id="nS" type="number" inputmode="numeric" min="0" placeholder="0"><span>秒</span>
    </div>
    <div class="row"><button class="p grow" id="nGo">タイマーを開始</button></div>
  </div>
</section>

<section id="tabP" class="hide">
  <h2>プリセット一覧</h2>
  <div id="plist"></div>
  <h2>プリセットを作る</h2>
  <div class="card">
    <input id="pName" placeholder="プリセット名(例:カップ麺)" maxlength="30">
    <div class="hms">
      <input id="pH" type="number" inputmode="numeric" min="0" placeholder="0"><span>時間</span>
      <input id="pM" type="number" inputmode="numeric" min="0" placeholder="0"><span>分</span>
      <input id="pS" type="number" inputmode="numeric" min="0" placeholder="0"><span>秒</span>
    </div>
    <div class="row"><button class="p grow" id="pSave">プリセットを保存</button></div>
  </div>
</section>

<nav>
  <button id="bT" class="on">タイマー</button>
  <button id="bP">プリセット</button>
</nav>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var KP='mt_presets_v1',KT='mt_timers_v1';
var presets=load(KP,[{id:'p1',name:'カップ麺',sec:180},{id:'p2',name:'ゆで卵',sec:420},{id:'p3',name:'紅茶',sec:240}]);
var timers=load(KT,[]);
var actx=null;
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(){try{localStorage.setItem(KP,JSON.stringify(presets));localStorage.setItem(KT,JSON.stringify(timers))}catch(e){}}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(s){s=Math.max(0,Math.ceil(s));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;
 return (h?h+':':'')+(h?String(m).padStart(2,'0'):m)+':'+String(r).padStart(2,'0')}
function label(s){var h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;
 return (h?h+'時間':'')+(m?m+'分':'')+(r?r+'秒':'')||'0秒'}
function readHMS(a,b,c){return (parseInt($(a).value)||0)*3600+(parseInt($(b).value)||0)*60+(parseInt($(c).value)||0)}
function unlock(){try{var C=window.AudioContext||window.webkitAudioContext;if(!actx)actx=new C();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){try{if(!actx)return;[0,.25,.5].forEach(function(t){var o=actx.createOscillator(),g=actx.createGain();
 o.frequency.value=880;o.connect(g);g.connect(actx.destination);var n=actx.currentTime+t;
 g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.4,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+.2);o.start(n);o.stop(n+.22)})}catch(e){}
 try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}

function remaining(t){return t.running?(t.endAt-Date.now())/1000:t.left}

function start(name,sec){
 if(sec<=0)return;unlock();
 timers.unshift({id:uid(),name:name||'',total:sec,left:sec,endAt:Date.now()+sec*1000,running:true,done:false});
 save();renderTimers();
}

function renderChips(){
 $('chips').innerHTML=presets.length?presets.map(function(p){
  return '<button class="chip" data-start="'+p.id+'">'+esc(p.name)+'<small>'+label(p.sec)+'</small></button>'}).join('')
  :'<div class="empty">プリセットはまだありません。下の「プリセット」タブで作れます。</div>';
}
function renderPresets(){
 $('plist').innerHTML=presets.length?presets.map(function(p){
  return '<div class="card pre"><div class="grow"><b>'+esc(p.name)+'</b><small>'+label(p.sec)+'</small></div>'+
  '<button class="p" data-start="'+p.id+'">開始</button><button class="d" data-delp="'+p.id+'">削除</button></div>'}).join('')
  :'<div class="empty">まだありません。下のフォームから作成してください。</div>';
}
function renderTimers(){
 var el=document.activeElement;if(el&&el.classList&&el.classList.contains('name'))return;
 $('list').innerHTML=timers.length?timers.map(function(t){
  return '<div class="card'+(t.done?' done':'')+'" data-id="'+t.id+'">'+
  '<input class="name" data-name="'+t.id+'" value="'+esc(t.name)+'" placeholder="名前なし" maxlength="30" aria-label="タイマー名">'+
  '<div class="time" data-time="'+t.id+'">'+fmt(remaining(t))+'</div>'+
  '<div class="bar"><i data-bar="'+t.id+'"></i></div>'+
  '<div class="row">'+(t.done?'<button class="p grow" data-stop="'+t.id+'">止める</button>':
   '<button class="p grow" data-toggle="'+t.id+'">'+(t.running?'一時停止':'再開')+'</button><button data-reset="'+t.id+'">リセット</button>')+
  '<button class="d" data-del="'+t.id+'">削除</button></div></div>'}).join('')
  :'<div class="empty">動いているタイマーはありません。</div>';
 tick();
}
function tick(){
 var changed=false;
 timers.forEach(function(t){
  var r=remaining(t);
  if(t.running&&r<=0&&!t.done){t.done=true;t.running=false;t.left=0;changed=true;beep();t.lastBeep=Date.now()}
  if(t.done&&Date.now()-(t.lastBeep||0)>2500){beep();t.lastBeep=Date.now()}
  var te=document.querySelector('[data-time="'+t.id+'"]');if(te)te.textContent=fmt(remaining(t));
  var be=document.querySelector('[data-bar="'+t.id+'"]');if(be)be.style.width=(Math.max(0,remaining(t))/t.total*100)+'%';
 });
 if(changed){save();renderTimers()}
}
setInterval(tick,250);
document.addEventListener('visibilitychange',tick);

function find(id){return timers.filter(function(t){return t.id===id})[0]}
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;var d=b.dataset;
 if(d.start){var p=presets.filter(function(x){return x.id===d.start})[0];if(p){start(p.name,p.sec);showTab('T')}}
 else if(d.delp){presets=presets.filter(function(x){return x.id!==d.delp});save();renderPresets();renderChips()}
 else if(d.toggle){var t=find(d.toggle);if(t){if(t.running){t.left=remaining(t);t.running=false}else{t.endAt=Date.now()+t.left*1000;t.running=true}save();renderTimers()}}
 else if(d.reset){var t2=find(d.reset);if(t2){t2.left=t2.total;t2.running=false;save();renderTimers()}}
 else if(d.stop||d.del){var id=d.stop||d.del;timers=timers.filter(function(x){return x.id!==id});save();renderTimers()}
});
document.addEventListener('input',function(e){
 var id=e.target.dataset&&e.target.dataset.name;if(id){var t=find(id);if(t){t.name=e.target.value;save()}}
});
document.addEventListener('focusout',function(e){if(e.target.classList&&e.target.classList.contains('name'))setTimeout(renderTimers,0)});

$('nGo').onclick=function(){var s=readHMS('nH','nM','nS');if(s<=0){$('nM').focus();return}
 start($('nName').value.trim(),s);$('nName').value='';$('nH').value='';$('nM').value='';$('nS').value=''};
$('pSave').onclick=function(){var s=readHMS('pH','pM','pS'),n=$('pName').value.trim();
 if(!n){$('pName').focus();return}if(s<=0){$('pM').focus();return}
 presets.push({id:uid(),name:n,sec:s});save();renderPresets();renderChips();
 $('pName').value='';$('pH').value='';$('pM').value='';$('pS').value=''};

function showTab(k){$('tabT').classList.toggle('hide',k!=='T');$('tabP').classList.toggle('hide',k!=='P');
 $('bT').classList.toggle('on',k==='T');$('bP').classList.toggle('on',k==='P');window.scrollTo(0,0)}
$('bT').onclick=function(){showTab('T')};$('bP').onclick=function(){showTab('P')};

timers.forEach(function(t){if(t.running&&t.endAt<=Date.now()){t.done=true;t.running=false;t.left=0}});
renderChips();renderPresets();renderTimers();
})();
</script>
</body>
</html>
